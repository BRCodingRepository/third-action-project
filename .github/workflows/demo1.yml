name: First Workflow
on: 
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Build Code
        run: npm run  build
      - name: Deploy In Kubernetes
        run: echo "Deploying ....."